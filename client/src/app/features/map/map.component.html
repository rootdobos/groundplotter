<div id="map" class="w-full h-full"></div>
<hlm-popover [state]="getPopoverState()" #popover="brnPopover" >
  <button hlmPopoverTrigger>
    <!-- trigger -->
  </button>

  <hlm-popover-content *hlmPopoverPortal="let ctx">
    @if (getHoveredElement(); as el) {
        <p>{{el.name}}</p>
    }
  </hlm-popover-content>
</hlm-popover>
